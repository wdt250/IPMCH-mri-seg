name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile project extensions
        run: |
          python -m compileall -q \
            train_debiformer_proto.py \
            research \
            ultralytics/data/triplet_sampler.py \
            ultralytics/models/yolo/segment/train_proto.py \
            ultralytics/utils/plane_consistency.py
